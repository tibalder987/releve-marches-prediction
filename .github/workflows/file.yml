name: file
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/file.yml', 'file_5m.py']
  schedule:
    - cron: '37 * * * *'
concurrency:
  group: file
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: File crypto 5 minutes
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 19200 ))
          while [ $(date +%s) -lt $END ]; do
            CODE=0
            python3 file_5m.py --dir file --max-seconds 3300 --until 2026-12-07T08:00:00Z || CODE=$?
            gzip -f file/file-*.jsonl 2>/dev/null || true
            git add -A file && git commit -q -m "file $(date -u +%FT%TZ)" || true
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || true
            if [ $CODE -ne 0 ]; then break; fi
          done
