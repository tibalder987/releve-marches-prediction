name: kalshi2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kalshi2.yml', 'relance/kalshi.txt']
concurrency:
  group: kalshi
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Relance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f kalshi/DONE ]; then
            for i in 1 2 3 4 5; do gh workflow run kalshi2.yml --ref main && break; sleep 20; done || true
          fi
      - name: Rejeu Kalshi
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          sync() { for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && return 0; git rebase --abort 2>/dev/null || true; sleep 5; done; return 0; }
          END=$(( $(date +%s) + 19200 ))
          while [ $(date +%s) -lt $END ] && [ ! -f kalshi/DONE ]; do
            CODE=0
            python3 kalshi_replay.py --start 2026-05-20 --end 2026-11-19 --budget-seconds 1200 --dir kalshi || CODE=$?
            git add -A kalshi && git commit -q -m "kalshi $(date -u +%FT%TZ)" || true
            sync
            if [ $CODE -ne 0 ]; then sleep 60; fi
          done
